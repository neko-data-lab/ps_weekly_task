<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="style.css"><title>管理・編集</title></head><body><header class="topbar"><div><div class="eyebrow">ADMIN TOOLS</div><h1>スケジュール管理</h1></div><a class="textbtn" href="index.html">← 戻る</a></header><main>
<div class="card"><h2>編集データについて</h2><p class="task-detail">ここでの編集内容は、この端末のブラウザ内に一時保存されます。全員に反映するには「JSONを書き出す」で schedule.json を保存し、GitHub Pagesのリポジトリ内の同名ファイルを置き換えて公開してください。管理画面にパスワード保護はありません。</p><div class="task-actions"><button class="primarybtn" id="export">JSONを書き出す</button><label class="mini-btn">JSONを読み込む<input type="file" id="import" accept=".json,application/json" hidden></label><button class="mini-btn" id="reset">公開データに戻す</button></div></div>
<div class="section"><h2>タスク一覧・編集</h2><label class="short-label">週タイプ</label><select id="week" style="width:100%;padding:12px;border-radius:10px;margin:6px 0 12px;background:#17263b;color:white"></select><label class="short-label">曜日</label><select id="day" style="width:100%;padding:12px;border-radius:10px;margin:6px 0 12px;background:#17263b;color:white"></select><div id="list"></div></div>
<div class="section card"><h2 id="formTitle">タスク追加</h2><input type="hidden" id="id"><label class="short-label">タスク名</label><input id="title" class="admininput"><label class="short-label">詳細・注意事項</label><textarea id="detail" class="admininput"></textarea><div class="formgrid"><div><label class="short-label">分類</label><select id="category" class="admininput"><option>個人</option><option>ギルド</option></select></div><div><label class="short-label">時刻（任意・HH:MM）</label><input id="time" class="admininput" placeholder="21:45"></div></div><label class="short-label">使用アイテム（読点またはカンマ区切り）</label><input id="items" class="admininput"><label class="checkline"><input type="checkbox" id="lion"> 獅子奮迅の被り候補</label><button class="primarybtn" id="save">保存</button><button class="mini-btn" id="clear">入力をクリア</button></div>
</main><script src="admin.js"></script><style>.admininput{display:block;width:100%;margin:6px 0 12px;background:#101d30;color:white;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checkline{display:flex;gap:10px;align-items:center;margin:10px 0}.checkline input{width:22px;height:22px}.admin-task{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;margin:7px 0;display:flex;justify-content:space-between;gap:8px}.admin-task small{display:block;color:var(--muted)}.admin-task button{background:#30435e;color:white;border:0;border-radius:8px;padding:7px}</style></body></html>
